  ########################################
  # Optional: DockGo Agent (remote host)
  #
  # Runs on each host whose Docker daemon you want to manage from the
  # DockGo server dashboard. Create the agent on the server's "Agents"
  # page first and set its key here. The agent dials OUT to the server,
  # so no inbound ports are required on this host.
  #
  # Run with:
  #   docker compose -f docker-compose.yml -f docker-compose.agent.yml up -d
  # or uncomment this block in this file.
  ########################################

  dockgo-agent-dev:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: dockgo-agent-dev
    restart: unless-stopped
    environment:
      - DOCKGO_SERVER_URL=ws://192.168.1.220:3838/api/ws/agent
      - AGENT_KEY=dg_COrxklRwT6pOL5jUshAWmH5rNBdlTwZzLjV8NWrjzRE
      - AGENT_NAME=media-server
      # Maps Windows host compose paths to the in-container mount point so
      # the agent can resolve paths like D:\Docker\test-apps\1.
      - COMPOSE_PATH_MAPPING=D:\Docker:/compose
    volumes:
      # Required: Docker socket access for container discovery and updates.
      # WARNING: Grants Docker-level privileges to this agent.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount compose directories this agent should manage, mapped via
      # COMPOSE_PATH_MAPPING (D:\Docker -> /compose).
      - D:\Docker:/compose
      - D:\code\workspace:/ws-compose
      # Persistent agent-local data (agent stack store etc.).
      - ./data:/app/data

